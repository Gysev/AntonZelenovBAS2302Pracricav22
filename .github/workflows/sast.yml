name: build-and-sast

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "sast-task3" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: eclipse-temurin:21-jdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build, test, package
        run: ./mvnw -B clean test package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: ./target/*.jar

  sast:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep (SARIF)
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
          args: semgrep scan --sarif --output=semgrep.sarif
        continue-on-error: true

      - name: Show SARIF summary
        if: always()
        run: |
          python - << 'PY'
          import json
          p="semgrep.sarif"
          d=json.load(open(p,encoding="utf-8"))
          runs=d.get("runs",[])
          results=(runs[0].get("results",[]) if runs else [])
          print("RESULTS:", len(results))
          for r in results[:30]:
            rule=r.get("ruleId")
            msg=r.get("message",{}).get("text","")
            locs=r.get("locations",[])
            loc=locs[0].get("physicalLocation",{}).get("artifactLocation",{}).get("uri","") if locs else ""
            line=locs[0].get("physicalLocation",{}).get("region",{}).get("startLine","") if locs else ""
            print(f"- {rule} {loc}:{line} :: {msg[:120]}")
          PY

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif

      - name: Upload SARIF to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
