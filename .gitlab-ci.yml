stages:
  - build
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

build:
  stage: build
  image: eclipse-temurin:21-jdk
  script:
    - chmod +x mvnw || true
    - ./mvnw -B clean test package
  artifacts:
    when: always
    paths:
      - target/*.jar
    expire_in: 1 week

sast_semgrep:
  stage: test
  image: python:3.12-slim
  needs: ["build"]
  script:
    - pip install --no-cache-dir semgrep
    - semgrep scan --config auto --sarif --output gl-sast-report.sarif || true
  artifacts:
    when: always
    reports:
      sast: gl-sast-report.sarif
    paths:
      - gl-sast-report.sarif
    expire_in: 1 week
