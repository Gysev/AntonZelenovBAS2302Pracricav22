name: build-and-sast

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "sast-task3" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: eclipse-temurin:21-jdk
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x mvnw
      - run: ./mvnw -B clean test package
      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: ./target/*.jar

  sast:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep (SARIF)
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto
          args: semgrep scan --sarif --output=semgrep.sarif
        continue-on-error: true

      - name: Upload SARIF to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
